<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Faded Without Notice — Customer Churn Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Special+Elite&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg:#303B75; --surface:#14171f; --surface2:#1c2030;
      --border:#638140; --accent:#f2d753; --accent2:#d8aa3c;
      --accent3:#233d81; --text:#f0e8c8; --muted:#fff;
      --muted2:#fff; --pass:#ebc311; --fail:#ffff;
      --font-ui: 'Inter', system-ui, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-stamp: 'Special Elite', 'Courier New', monospace;
      --font-prose: 'IM Fell English', Georgia, serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    header{position:relative;z-index:10;padding:28px 48px 20px;
        border-bottom:1px solid var(--border);
        background:linear-gradient(180deg,rgba(242,215,83,.05) 0%,transparent 100%);
        text-align:center}
      .mr{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--border),var(--accent2),var(--border),transparent);margin:8px 0}
      .mr.thin{opacity:.35;margin:4px 0}
      .logo-eyebrow{font-family:var(--font-stamp);font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
      .logo-mark{font-family:var(--font-display);font-size:42px;font-weight:700;font-style:italic;
        color:var(--accent);letter-spacing:-1px;line-height:1;
        text-shadow:0 2px 24px rgba(242,215,83,.18);display:block}
      .logo-sub{font-family:var(--font-stamp);font-size:10px;color:var(--muted);letter-spacing:5px;
        text-transform:uppercase;display:block;margin-top:5px}
      .hdr-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
      .hdr-date{font-family:var(--font-ui);font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:500}
      .hdr-issue{font-family:var(--font-prose);font-size:12px;color:var(--accent2);font-style:italic} 

  </style>
</head>
